<main class="bu-login">
  <form class="bu-login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="head">
      <h1 class="brand">Buget</h1>
      <p class="bu-muted">Bugetul vostru lunar, împreună.</p>
    </div>

    <div class="bu-field">
      <label class="lbl" for="email">Email</label>
      <div class="bu-input">
        <input id="email" type="email" formControlName="email" autocomplete="username" inputmode="email" />
      </div>
    </div>

    <div class="bu-field">
      <label class="lbl" for="password">Parolă</label>
      <div class="bu-input">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="eye"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="showPassword() ? 'Ascunde parola' : 'Arată parola'"
        >
          <bu-icon name="eye" [size]="18" />
        </button>
      </div>
    </div>

    <button type="submit" class="bu-btn primary block" [disabled]="busy()">Autentificare</button>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <p class="foot caption bu-muted">Un singur cont pentru amândoi.</p>
  </form>
</main>
